name: bump music source version

on:
  push:
    paths:
      - '.github/workflows/bump-music-version.yml'
      - 'tools/bump_music_version.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch version lines
        run: python3 tools/bump_music_version.py
      - name: Commit if changed
        run: |
          git config user.name 'yyzone-bot'
          git config user.email 'bot@yyzone.local'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to change'
          else
            git commit -m 'chore(music): bump YY Zone music source to 1.3.1'
            git push
          fi
